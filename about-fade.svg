<svg width="480" height="330" viewBox="0 0 480 330" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="330" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- About heading -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
    <text x="24" y="42" fill="#58A6FF" font-size="18" font-weight="700">About</text>
  </g>

  <!-- About bullet 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <circle cx="30" cy="72" r="2.5" fill="#8B949E"/>
    <text x="42" y="77" fill="#C9D1D9" font-size="14">Self-taught C++ developer, learning by developing</text>
    <text x="42" y="96" fill="#C9D1D9" font-size="14">rather than by courses</text>
  </g>

  <!-- About bullet 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <circle cx="30" cy="122" r="2.5" fill="#8B949E"/>
    <text x="42" y="127" fill="#C9D1D9" font-size="14">Competitive programming on Codeforces in spare time</text>
  </g>

  <!-- Currently building heading -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
    <text x="24" y="172" fill="#58A6FF" font-size="18" font-weight="700">Currently building</text>
  </g>

  <!-- Epsilon -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.8s" fill="freeze"/>
    <circle cx="30" cy="202" r="2.5" fill="#8B949E"/>
    <text x="42" y="207" fill="#C9D1D9" font-size="14">
      <tspan fill="#58A6FF" font-weight="600">Epsilon</tspan> — a chess engine, working on search
    </text>
    <text x="42" y="226" fill="#C9D1D9" font-size="14">and evaluation</text>
  </g>

  <!-- EpsilonMath -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
    <circle cx="30" cy="252" r="2.5" fill="#8B949E"/>
    <text x="42" y="257" fill="#C9D1D9" font-size="14">
      <tspan fill="#58A6FF" font-weight="600">EpsilonMath</tspan> — a CPU benchmark tool,
    </text>
    <text x="42" y="276" fill="#C9D1D9" font-size="14">refactoring the core</text>
  </g>
</svg>
