<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="360" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- About heading -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
    <text x="32" y="46" fill="#58A6FF" font-size="20" font-weight="700">About</text>
  </g>

  <!-- About bullet 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <circle cx="38" cy="78" r="2.5" fill="#8B949E"/>
    <text x="50" y="83" fill="#C9D1D9" font-size="15">Self-taught C++ developer, learning by developing</text>
    <text x="50" y="104" fill="#C9D1D9" font-size="15">rather than by courses</text>
  </g>

  <!-- About bullet 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <circle cx="38" cy="132" r="2.5" fill="#8B949E"/>
    <text x="50" y="137" fill="#C9D1D9" font-size="15">Competitive programming on Codeforces in spare time</text>
  </g>

  <!-- Currently building heading -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
    <text x="32" y="188" fill="#58A6FF" font-size="20" font-weight="700">Currently building</text>
  </g>

  <!-- Epsilon -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.8s" fill="freeze"/>
    <circle cx="38" cy="220" r="2.5" fill="#8B949E"/>
    <text x="50" y="225" fill="#C9D1D9" font-size="15">
      <tspan fill="#58A6FF" font-weight="600">Epsilon</tspan> — a chess engine, working on search
    </text>
    <text x="50" y="246" fill="#C9D1D9" font-size="15">and evaluation</text>
  </g>

  <!-- EpsilonMath -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
    <circle cx="38" cy="274" r="2.5" fill="#8B949E"/>
    <text x="50" y="279" fill="#C9D1D9" font-size="15">
      <tspan fill="#58A6FF" font-weight="600">EpsilonMath</tspan> — a CPU benchmark tool,
    </text>
    <text x="50" y="300" fill="#C9D1D9" font-size="15">refactoring the core</text>
  </g>

  <!-- subtle underline accent, fades in last -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/>
    <rect x="32" y="326" width="120" height="3" rx="1.5" fill="#238636"/>
  </g>
</svg>
